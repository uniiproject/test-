<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه فرسودگی تحصیلی</title>

<style>
body{
  font-family:tahoma;
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background: linear-gradient(135deg,#f7e6ff,#ffe6f2);
}

/* 🌸 گل‌های انیمیشنی */
.flowers{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
  overflow:hidden;
}

.flower{
  position:absolute;
  width:40px;
  height:40px;
  background: radial-gradient(circle, #ff9ecb 20%, #ff6fae 60%, transparent 70%);
  border-radius:50%;
  opacity:0.6;
  animation: float 14s infinite linear;
}

@keyframes float{
  0%{
    transform: translateY(100vh) scale(0.6) rotate(0deg);
    opacity:0;
  }
  20%{opacity:0.8;}
  100%{
    transform: translateY(-10vh) scale(1.2) rotate(360deg);
    opacity:0;
  }
}

.f1{ left:10%; animation-duration:14s; }
.f2{ left:25%; animation-duration:11s; width:30px; height:30px; }
.f3{ left:50%; animation-duration:16s; width:45px; height:45px; }
.f4{ left:70%; animation-duration:13s; }
.f5{ left:85%; animation-duration:18s; width:35px; height:35px; }

/* 🌸 کارت اصلی */
.box{
  width:90%;
  max-width:750px;
  background:rgba(255,255,255,0.92);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  position:relative;
  z-index:2;
}

/* دکمه */
.btn{
  background:#b388ff;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

/* گزینه‌ها */
.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #e0d4ff;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 🌸 گل‌ها -->
<div class="flowers">
  <div class="flower f1"></div>
  <div class="flower f2"></div>
  <div class="flower f3"></div>
  <div class="flower f4"></div>
  <div class="flower f5"></div>
</div>

<div class="box">
  <div id="app"></div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9kjcA-k_lNqYOAxEVrm3mbfXfM6i_2pIA5NpanLUWpnZOzbWlji23zDU4c8k5-iFg/exec";

/* ---------- INTRO (FULL TEXT FIXED) ---------- */
const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌های ارائه‌شده توسط شما کاملاً محرمانه تلقی شده و فقط برای اهداف علمی و پژوهشی مورد استفاده قرار خواهد گرفت. همچنین هیچ‌یک از اطلاعات فردی یا نتایج پاسخ‌ها در اختیار اشخاص یا نهادهای دیگر قرار نخواهد گرفت و از انتشار آن‌ها به هر شکل جلوگیری خواهد شد.

از اینکه با صرف وقت و دقت خود در این پژوهش مشارکت می‌کنید، صمیمانه سپاسگزاریم. همکاری ارزشمند شما نقش مهمی در پیشبرد این تحقیق خواهد داشت.
`;

/* ---------- QUESTIONS ---------- */
const questions = [
"احساس میکنم که به خاطر فعالیت های مربوط به تحصیل تهی شده‌ام.",
"در پایان روز در دانشگاه احساس بی رمقی میکنم.",
"وقتی صبح بیدار میشوم و مجبورم روز دیگری در دانشگاه سپری کنم احساس خستگی میکنم.",
"با مطالعه یا حضور در کلاس به من فشار می‌آید.",
"به خاطر انجام فعالیت های مربوط به تحصیل احساس فرسودگی میکنم.",
"از زمان قبولی و ثبت نام در دانشگاه نسبت به دروسم کم علاقه شده‌ام.",
"نسبت به دروسم شور و شوق کمتری دارم.",
"نسبت به اهمیت دروسم تردید دارم.",
"نسبت به کاربرد دروسم بیشتر بدگمان شده ام.",
"به طور موثری میتوانم مشکلاتی را که در فعالیت های مربوط به تحصیلم بوجود می‌آید را حل کنم.",
"معتقدم که مشارکت موثری در کلاس ها دارم.",
"به عقیده خودم دانشجوی خوبی هستم.",
"وقتی به اهداف تحصیلی ام می‌رسم احساس برانگیختگی میکنم.",
"موارد جالب زیادی را در جریان تحصیل یاد گرفته‌ام.",
"در طول کلاس اطمینان دارم که در انجام کارها مؤثر هستم."
];

/* ---------- OPTIONS ---------- */
const options = [
"هرگز",
"خیلی",
"نسبتا کم",
"گاهی",
"نسبتا زیاد",
"بیشتر",
"همیشه"
];

let step = -1;
let answers = {};
const app = document.getElementById("app");

/* ---------- RENDER ---------- */
function render(){

  if(step === -1){
    app.innerHTML = `
      <p style="white-space:pre-line;line-height:2">${introText}</p>
      <button class="btn" onclick="start()">شروع</button>
    `;
    return;
  }

  if(step === 0){
    app.innerHTML = `
      <h3>اطلاعات فردی</h3>

      <label>سن:
        <input id="age" type="number">
      </label>

      <br><br>

      <label><input type="radio" name="g" value="زن"> زن</label>
      <label><input type="radio" name="g" value="مرد"> مرد</label>

      <br>
      <button class="btn" onclick="startSurvey()">ادامه</button>
    `;
    return;
  }

  const q = questions[step-1];

  app.innerHTML = `
    <h3>سوال ${step} از ${questions.length}</h3>
    <p>${q}</p>

    ${options.map(o => `
      <label class="option">
        <input type="radio" name="ans" value="${o}">
        ${o}
      </label>
    `).join('')}

    <button class="btn" onclick="next()">بعدی</button>
  `;
}

/* ---------- FLOW ---------- */
function start(){
  step = 0;
  render();
}

function startSurvey(){

  const g = document.querySelector('input[name="g"]:checked');

  if(!g){
    alert("جنسیت را انتخاب کنید");
    return;
  }

  answers.age = document.getElementById("age").value;
  answers.gender = g.value;

  step = 1;
  render();
}

function next(){

  const a = document.querySelector('input[name="ans"]:checked');

  if(!a){
    alert("یک گزینه انتخاب کنید");
    return;
  }

  answers["q"+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  }else{
    finish();
  }
}

/* ---------- SEND TO SHEET ---------- */
function finish(){

  fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      age:answers.age,
      gender:answers.gender,
      answers:questions.map((_,i)=>answers["q"+(i+1)])
    })
  });

  app.innerHTML = `
    <h2>🎉 پایان پرسشنامه</h2>
    <p>پاسخ شما ثبت شد</p>
  `;
}

render();

</script>
</body>
</html>
