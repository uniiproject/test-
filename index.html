<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه فرسودگی تحصیلی</title>

<style>
body{
  font-family:tahoma;
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background: radial-gradient(circle at top,#ffe6f5,#f3d6ff);
}

/* 🌸 بک‌گراند کاملاً پر از گل */
.bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

/* 🌸 گل پیکسلی واقعی */
.flower{
  position:absolute;
  width:18px;
  height:18px;
  background:#ff4fa3;
  border-radius:50%;
  opacity:0.7;

  box-shadow:
    0 -12px 0 #ff7ac8,
    12px 0 0 #ff2fa0,
    0 12px 0 #ff7ac8,
    -12px 0 0 #ff2fa0;

  animation: float 14s linear infinite;
}

@keyframes float{
  0%{
    transform: translateY(110vh) rotate(0deg);
    opacity:0;
  }
  20%{opacity:0.9;}
  100%{
    transform: translateY(-15vh) rotate(360deg);
    opacity:0;
  }
}

/* پخش کامل در صفحه */
.f1{left:2%; animation-duration:12s;}
.f2{left:6%; animation-duration:16s;}
.f3{left:10%; animation-duration:10s;}
.f4{left:14%; animation-duration:14s;}
.f5{left:18%; animation-duration:18s;}
.f6{left:22%; animation-duration:11s;}
.f7{left:26%; animation-duration:15s;}
.f8{left:30%; animation-duration:13s;}
.f9{left:34%; animation-duration:17s;}
.f10{left:38%; animation-duration:12s;}
.f11{left:42%; animation-duration:14s;}
.f12{left:46%; animation-duration:16s;}
.f13{left:50%; animation-duration:11s;}
.f14{left:54%; animation-duration:19s;}
.f15{left:58%; animation-duration:13s;}
.f16{left:62%; animation-duration:15s;}
.f17{left:66%; animation-duration:10s;}
.f18{left:70%; animation-duration:14s;}
.f19{left:74%; animation-duration:12s;}
.f20{left:78%; animation-duration:16s;}
.f21{left:82%; animation-duration:11s;}
.f22{left:86%; animation-duration:18s;}
.f23{left:90%; animation-duration:13s;}
.f24{left:94%; animation-duration:15s;}
.f25{left:98%; animation-duration:12s;}

/* کارت */
.box{
  width:90%;
  max-width:750px;
  background:rgba(255,255,255,0.92);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  position:relative;
  z-index:2;
  backdrop-filter: blur(6px);
}

.btn{
  background:#b388ff;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #e0d4ff;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- 🌸 بک‌گراند -->
<div class="bg">
  <div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div>
  <div class="flower f4"></div><div class="flower f5"></div><div class="flower f6"></div>
  <div class="flower f7"></div><div class="flower f8"></div><div class="flower f9"></div>
  <div class="flower f10"></div><div class="flower f11"></div><div class="flower f12"></div>
  <div class="flower f13"></div><div class="flower f14"></div><div class="flower f15"></div>
  <div class="flower f16"></div><div class="flower f17"></div><div class="flower f18"></div>
  <div class="flower f19"></div><div class="flower f20"></div><div class="flower f21"></div>
  <div class="flower f22"></div><div class="flower f23"></div><div class="flower f24"></div>
  <div class="flower f25"></div>
</div>

<div class="box">
  <div id="app"></div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9kjcA-k_lNqYOAxEVrm3mbfXfM6i_2pIA5NpanLUWpnZOzbWlji23zDU4c8k5-iFg/exec";

/* INTRO */
const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً برای پژوهش دانشگاهی است.
پاسخ‌ها کاملاً محرمانه هستند.

با تشکر از همکاری شما.
`;

/* QUESTIONS */
const questions = [
"احساس خستگی تحصیلی دارم.",
"بعد از دانشگاه بی‌انرژی هستم.",
"مطالعه برایم فشار دارد.",
"از درس‌ها خسته شده‌ام.",
"احساس فرسودگی دارم.",
"علاقه‌ام کم شده.",
"شوق قبلی را ندارم.",
"در اهمیت درس شک دارم.",
"بدبین شده‌ام.",
"می‌توانم مشکلات را حل کنم.",
"در کلاس فعال هستم.",
"دانشجوی خوبی هستم.",
"انگیزه دارم.",
"چیزهای مفید یاد می‌گیرم.",
"در کارها مؤثرم."
];

/* OPTIONS */
const options = ["هرگز","کم","متوسط","زیاد","خیلی زیاد"];

let step = -1;
let answers = {};
const app = document.getElementById("app");

/* RENDER */
function render(){

  if(step === -1){
    app.innerHTML = `
      <p style="white-space:pre-line;line-height:2">${introText}</p>
      <button class="btn" onclick="start()">شروع</button>
    `;
    return;
  }

  if(step === 0){
    app.innerHTML = `
      <h3>اطلاعات فردی</h3>

      <input id="age" type="number" placeholder="سن">

      <br><br>

      <label><input type="radio" name="g" value="زن"> زن</label>
      <label><input type="radio" name="g" value="مرد"> مرد</label>

      <br>
      <button class="btn" onclick="startSurvey()">ادامه</button>
    `;
    return;
  }

  const q = questions[step-1];

  app.innerHTML = `
    <h3>سوال ${step} از ${questions.length}</h3>
    <p>${q}</p>

    ${options.map(o => `
      <label class="option">
        <input type="radio" name="ans" value="${o}">
        ${o}
      </label>
    `).join('')}

    <button class="btn" onclick="next()">بعدی</button>
  `;
}

/* FLOW */
function start(){ step=0; render(); }

function startSurvey(){
  const g = document.querySelector('input[name="g"]:checked');
  if(!g){ alert("جنسیت را انتخاب کنید"); return; }

  answers.age = document.getElementById("age").value;
  answers.gender = g.value;

  step=1;
  render();
}

function next(){
  const a = document.querySelector('input[name="ans"]:checked');
  if(!a){ alert("یک گزینه انتخاب کنید"); return; }

  answers["q"+step]=a.value;

  if(step < questions.length){
    step++;
    render();
  }else{
    fetch(GOOGLE_SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({
        age:answers.age,
        gender:answers.gender,
        answers:questions.map((_,i)=>answers["q"+(i+1)])
      })
    });

    app.innerHTML = `
      <h2>🎉 پایان پرسشنامه</h2>
      <p>پاسخ شما ثبت شد</p>
    `;
  }
}

render();

</script>

</body>
</html>
